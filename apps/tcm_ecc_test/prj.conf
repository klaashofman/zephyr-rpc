
# Console to a RAM buffer, exported to Linux as remoteproc trace0.
# The DTCM ECC fix comes from the frdm-imx95 module (EXTRA_ZEPHYR_MODULES).
CONFIG_CONSOLE=y
CONFIG_RAM_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_OPENAMP_RSC_TABLE=y
CONFIG_OPENAMP_RSC_TABLE_NUM_RPMSG_BUFF=0

# No drivers that talk to the System Manager, to isolate the TCM test
CONFIG_SERIAL=n
CONFIG_ARM_SCMI=n
CONFIG_MBOX=n
CONFIG_CLOCK_CONTROL=n
CONFIG_PINCTRL=n
