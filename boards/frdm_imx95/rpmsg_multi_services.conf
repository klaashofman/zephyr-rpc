CONFIG_CLOCK_CONTROL=y
CONFIG_LOG=y
CONFIG_CONSOLE=y
CONFIG_OPENAMP_WITH_DCACHE=y
CONFIG_ARM_SCMI=y
CONFIG_IPM_MBOX=y
CONFIG_MBOX_NXP_IMX_MU=y
CONFIG_MBOX_INIT_PRIORITY=0
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=0
CONFIG_OPENAMP_COPY_RSC_TABLE=y

# FRDM-i.MX95: send the console to a RAM buffer that Linux shows as
# /sys/kernel/debug/remoteproc/remoteproc1/trace0
CONFIG_RAM_CONSOLE=y
CONFIG_RAM_CONSOLE_BUFFER_SIZE=4096
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=y
